name: Build Android AAB Bundle (Google Play)

on:
  workflow_dispatch:
    inputs:
      app_host:
        description: 'النطاق الرسمي للتطبيق بدون https:// (مثال: ais-pre-nju7hiufddutmvceng4hoc-487180125030.europe-west2.run.app)'
        required: false
        default: 'ais-pre-nju7hiufddutmvceng4hoc-487180125030.europe-west2.run.app'
      app_version_name:
        description: 'رقم الإصدار النصي (مثال: 1.1.0)'
        required: false
        default: '1.1.0'
      app_version_code:
        description: 'رقم الإصدار الرقمي لمتجر جوجل بلاي (Version Code)'
        required: false
        default: '2'

permissions:
  contents: read

jobs:
  build-aab:
    name: Generate Signed Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17 (Required for Android Gradle & Keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & Platform 35
        run: |
          sdkmanager --install "build-tools;35.0.0" "platforms;android-35"

      - name: Generate or Restore Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-almihrab2026}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
            echo "Restored existing android.keystore from GitHub Secrets."
          else
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias almihrab-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -dname "CN=Al-Mihrab, OU=IslamicWaqf, O=AlMihrab, L=Makkah, S=Makkah, C=SA"
            echo "Generated fresh android.keystore."
          fi

          SHA256=$(keytool -list -v -keystore android.keystore -alias almihrab-key -storepass "$PASS" | grep -i "SHA256:" | sed 's/.*SHA256: //g' | tr -d ' \r\n')
          echo "SHA256 Fingerprint: $SHA256"

          cat > public/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": [
                "delegate_permission/common.handle_all_urls",
                "delegate_permission/common.query_webapk"
              ],
              "target": {
                "namespace": "android_app",
                "package_name": "app.almihrab.twa",
                "sha256_cert_fingerprints": [
                  "$SHA256"
                ]
              }
            }
          ]
          EOF

      - name: Install dependencies & Build Web Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Package Android App Bundle (.aab) via Capacitor Android Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-almihrab2026}"
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android.keystore" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias="almihrab-key" \
            -Pandroid.injected.signing.key.password="$PASS"

          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/al-mihrab-release.aab"

      - name: Upload Signed AAB, Keystore & Digital Asset Links
        uses: actions/upload-artifact@v4
        with:
          name: al-mihrab-google-play-aab-bundle
          path: |
            al-mihrab-release.aab
            android.keystore
            public/.well-known/assetlinks.json
            twa-manifest.json
          retention-days: 30
