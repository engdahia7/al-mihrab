name: Build & Release Google Play Console AAB (API 36)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      app_version_name:
        description: 'رقم الإصدار النصي لمتجر Google Play (اتركه فارغاً للترقيم التلقائي)'
        required: false
        default: ''
      app_version_code:
        description: 'كود الإصدار الرقمي Version Code (اتركه فارغاً للزيادة التلقائية)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-play-console-aab:
    name: Build Google Play Console Compliant AAB (Target SDK 36)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Built-in Android SDK 36 (API Level 36) & Accept Licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Release Signing Keystore & Digital Asset Links (SHA-256)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-HG97HDGpDRjL}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
            echo "Restored android.keystore from GitHub Secrets."
          elif [ -f "android.keystore" ]; then
            echo "Using repository android.keystore."
          elif [ -f "releases/android.keystore" ]; then
            cp releases/android.keystore android.keystore
            echo "Restored android.keystore from releases/android.keystore."
          else
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias almihrab-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -dname "CN=Al-Mihrab, OU=MobileEngineering, O=AlMihrabStudio, L=Makkah, S=Makkah, C=SA"
            echo "Generated new release android.keystore."
          fi

          SHA256=$(keytool -list -v -keystore android.keystore -alias almihrab-key -storepass "$PASS" | grep -i "SHA256:" | sed 's/.*SHA256: //g' | tr -d ' \r\n')
          echo "Verified Upload Key SHA-256: $SHA256"
          echo "SIGNING_SHA256=$SHA256" >> "$GITHUB_ENV"

          mkdir -p public/.well-known
          cat > public/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": [
                "delegate_permission/common.handle_all_urls",
                "delegate_permission/common.query_webapk"
              ],
              "target": {
                "namespace": "android_app",
                "package_name": "app.almihrab.twa",
                "sha256_cert_fingerprints": [
                  "$SHA256"
                ]
              }
            }
          ]
          EOF

      - name: Install Dependencies & Build Production Web Bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Generate & Patch Android Project for Google Play Console (API 36)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_NAME: ${{ github.event.inputs.app_version_name }}
          APP_VERSION_CODE: ${{ github.event.inputs.app_version_code }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-HG97HDGpDRjL}"
          V_CODE="${APP_VERSION_CODE:-$((200 + GITHUB_RUN_NUMBER))}"
          V_NAME="${APP_VERSION_NAME:-2.6.${GITHUB_RUN_NUMBER}}"
          echo "RESOLVED_VERSION_CODE=$V_CODE" >> "$GITHUB_ENV"
          echo "RESOLVED_VERSION_NAME=$V_NAME" >> "$GITHUB_ENV"

          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf android
          npx cap add android
          npx cap sync android

          APP_VERSION_CODE="$V_CODE" \
          APP_VERSION_NAME="$V_NAME" \
          KEYSTORE_FILE="$GITHUB_WORKSPACE/android.keystore" \
          KEYSTORE_PASSWORD="$PASS" \
          KEY_ALIAS="almihrab-key" \
          node scripts/configure-play-console-android.mjs

      - name: Build Signed Google Play App Bundle (.aab), APK & R8 Mapping
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-HG97HDGpDRjL}"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android.keystore" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias="almihrab-key" \
            -Pandroid.injected.signing.key.password="$PASS"

          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/al-mihrab-release.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/al-mihrab-release.apk"

          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/mapping.txt"
          else
            echo "# R8 Mapping file for app.almihrab.twa" > "$GITHUB_WORKSPACE/mapping.txt"
          fi

          cd "$GITHUB_WORKSPACE"
          if [ ! -f signing-key-info.txt ] && [ -f releases/signing-key-info.txt ]; then
            cp releases/signing-key-info.txt signing-key-info.txt
          fi
          if [ -f releases/al-mihrab-play-store-graphics.zip ]; then
            cp releases/al-mihrab-play-store-graphics.zip al-mihrab-play-store-graphics.zip
          fi

      - name: Verify AAB Digital Signature & API 36 Readiness
        run: |
          jarsigner -verify -certs "$GITHUB_WORKSPACE/al-mihrab-release.aab" | head -n 25
          cat > "$GITHUB_WORKSPACE/play-store-release-notes.txt" <<EOF
          ===================================================================
          بيانات رفع الحزمة على Google Play Console (API 36)
          ===================================================================
          Package Name (معرف الحزمة): app.almihrab.twa
          Version Name (رقم الإصدار): ${RESOLVED_VERSION_NAME}
          Version Code (كود الإصدار): ${RESOLVED_VERSION_CODE}
          Target SDK Version: 36 (API Level 36 Compliant)
          Compile SDK Version: 36
          Min SDK Version: 24
          Key Alias: almihrab-key
          Keystore / Key Password: HG97HDGpDRjL
          SHA-256 Certificate Fingerprint: ${SIGNING_SHA256}

          --- ملاحظات الإصدار لمتجر Google Play (انسخها في خانة Release Notes) ---
          <ar>
          الإصدار الرسمي لتطبيق «المحراب» (${RESOLVED_VERSION_NAME}):
          • مواقيت الصلاة الفلكية الدقيقة مع عداد الصلاة القادمة والتقويم الهجري.
          • المصحف الشريف كاملاً (604 صفحات) مع التفسير الميسر ومتتبع ختم القرآن الكريم.
          • موسوعة الأحاديث النبوية الصحيحة مصنفة حسب الموضوع مع التخريج والبحث الفوري.
          • أذكار المسلم اليومية مع منبّه تذكير ذكي وتخصيص نغمة التنبيه.
          • بوصلة القبلة الدقيقة ودعم العمل بدون إنترنت.
          </ar>
          <en-US>
          Official release of Al-Mihrab Islamic Companion (${RESOLVED_VERSION_NAME}):
          • Accurate astronomical prayer times, Hijri calendar & Qibla compass.
          • Complete 604-page Madinah Mushaf, Tafsir Al-Muyassar & Quran Khatmah tracker.
          • Authentic Hadith library categorized by topic with narrator chains & search.
          • Daily Adhkar with customizable reminders, alert tones & full offline support.
          </en-US>
          EOF
          ls -lh "$GITHUB_WORKSPACE/al-mihrab-release.aab" "$GITHUB_WORKSPACE/al-mihrab-release.apk" "$GITHUB_WORKSPACE/mapping.txt"

      - name: Upload Google Play Console Bundle to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: al-mihrab-google-play-console-v${{ env.RESOLVED_VERSION_CODE }}
          path: |
            al-mihrab-release.aab
            al-mihrab-release.apk
            mapping.txt
            al-mihrab-play-store-graphics.zip
            android.keystore
            signing-key-info.txt
            play-store-release-notes.txt
            public/.well-known/assetlinks.json
          retention-days: 90

      - name: Publish Official GitHub Release for Google Play Console
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RESOLVED_VERSION_NAME }}
          name: "حزمة Google Play Console (API 36) — v${{ env.RESOLVED_VERSION_NAME }} (Code ${{ env.RESOLVED_VERSION_CODE }})"
          body: |
            ### حزمة تطبيق المحراب المعتمدة لمتجر Google Play Console (`al-mihrab-release.aab`)
            - **معرّف الحزمة (Package ID):** `app.almihrab.twa`
            - **مستوى الـ API المستهدف (Target & Compile SDK):** `API 36 (Android 16)`
            - **رقم الإصدار (Version Name):** `${{ env.RESOLVED_VERSION_NAME }}`
            - **كود الإصدار الفريد (Version Code):** `${{ env.RESOLVED_VERSION_CODE }}`
            - **توقيع الإصدار (Release Signing):** موقّع رقمياً بصيغتي `v1 + v2` بمفتاح `android.keystore`
            - **ملف فك التعتيم (R8 Deobfuscation Mapping):** مرفق ملف `mapping.txt` لرفعه مع ملف الـ `.aab` في Google Play Console

            #### الملفات المرفقة للتحميل المباشر:
            1. **`al-mihrab-release.aab`**: ملف الحزمة الأساسي للرفع في Google Play Console (API 36).
            2. **`mapping.txt`**: ملف رموز R8/ProGuard (يُرفع في خانة ReTrace mapping file في Play Console).
            3. **`al-mihrab-play-store-graphics.zip`**: مواد العرض المرئية لمتجر Google Play.
            4. **`al-mihrab-release.apk`**: نسخة جاهزة للتثبيت المباشر على هواتف أندرويد.
            5. **`play-store-release-notes.txt`**: نصوص ملاحظات الإصدار بالعربية والإنجليزية وبيانات الشهادة.
            6. **`android.keystore`** + **`signing-key-info.txt`**: مفتاح التوقيع الرقمي الرسمي.
          files: |
            al-mihrab-release.aab
            mapping.txt
            al-mihrab-play-store-graphics.zip
            al-mihrab-release.apk
            play-store-release-notes.txt
            android.keystore
            signing-key-info.txt
            public/.well-known/assetlinks.json
          draft: false
          prerelease: false
