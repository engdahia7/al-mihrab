name: CI & Deploy PWA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'gh-pages-deploy'
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Typecheck, Unit Tests & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Build production PWA bundle
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing on GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Deploy directly to gh-pages branch (Zero Artifact Quota Used)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
